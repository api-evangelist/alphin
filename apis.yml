name: alphin
description: 'alphin is a Berlin-based marketing platform for local small businesses, giving restaurants,
  cafes, salons, and similar SMBs an all-in-one app to manage and automate their online presence. Its
  product suite spans review collection (alphin Reviews), Instagram and social management (alphin Socials),
  professional photography (alphin Photos), local influencer marketing (alphin Local Influencers), targeted
  Instagram advertising (alphin Local Ads), and multi-platform profile management across Google, TripAdvisor,
  and Yelp (alphin Portals), consolidated into one dashboard with daily reporting and analytics. Founded
  in 2016 (as Freachly GmbH), alphin serves 1,000+ local businesses across Germany, Austria, the UK, and
  Israel, and is backed by HV Capital, Partech, Scale Capital, and Wille Finance. alphin publishes no
  public API, developer portal, or SDKs; the product is delivered through its web and mobile Business App.'
